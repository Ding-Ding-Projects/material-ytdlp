appId: com.dingdingprojects.ytdlp-studio
productName: yt-dlp Studio

# This project publishes releases with the gh CLI, never with electron-builder.
# Left unset, electron-builder tries to resolve a publish target from
# .git/config at the END of a successful build, fails on a runner where it
# cannot detect one, and reports the whole build as failed - "Cannot cleanup:
# Cannot detect repository by .git/config" - with the installer already sitting
# on disk. Setting this to null stops it looking.
publish: null

directories:
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../vendor/bin
    to: bin

win:
  icon: build/icon.ico
  target:
    - target: squirrel
      arch:
        - x64
  # signExecutable, NOT signAndEditExecutable. Both skip code signing, but
  # signAndEditExecutable also skips resource editing, which silently strips the
  # icon and version metadata off the built executable - electron-builder says
  # so in its own log line and then carries on succeeding. This one skips only
  # the signing.
  #
  # Neither belongs at the top level: that fails schema validation outright on
  # electron-builder 26, and there is no top-level signExecutable key at all.
  signExecutable: false

# Code signing is permanently prohibited for this project. The installer
# ships unsigned on purpose; do not request, discover, or configure a
# certificate here.
forceCodeSigning: false

# Squirrel.Windows only. electron-builder 26's Squirrel schema uses these
# `squirrelWindows.*` keys; the legacy top-level `setupExe` / `noMsi` keys
# fail schema validation on this version and must not be used.
squirrelWindows:
  artifactName: '${productName}-Setup-${version}.${ext}'
  # Squirrel refuses to package without an icon URL, and it must be a real
  # reachable one - an invented or dead URL is worse than none, because the
  # installer then shows a broken icon to every user. This points at the icon
  # committed in this repository, which is public and returns 200.
  iconUrl: https://raw.githubusercontent.com/Ding-Ding-Projects/material-ytdlp/main/app/build/icon.ico
