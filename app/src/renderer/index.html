<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yt-dlp Studio</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f1414;
        color: #dee4e3;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
      }
      #root {
        height: 100vh;
        width: 100vw;
      }
      * {
        box-sizing: border-box;
      }
      /* Material Symbols ligature icons: the font is not bundled yet, so
         these render as their literal English name for now. That is an
         accepted interim state — never point this at a Google Fonts CDN,
         the app must work fully offline. */
      .msym {
        font-family: 'Segoe UI', sans-serif;
        font-style: normal;
        font-size: 18px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
