<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    yt-dlp Studio mark — original work for this project.
    Palette: background #0f1414, primary #82d5cc, on-primary #003733.
    Motif: a rounded square "frame" (the studio/window idea) with a single
    downward chevron-drop cut through its center (the download idea). No
    text, no play-triangle, no third-party silhouette — pure geometry so it
    still reads cleanly at 16px.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#132020"/>
      <stop offset="1" stop-color="#0f1414"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- frame: a single rounded square ring in the primary teal -->
  <rect x="48" y="48" width="160" height="160" rx="36"
        fill="none" stroke="#82d5cc" stroke-width="18"/>

  <!-- the drop / download chevron, cut through the frame's lower half -->
  <path d="M 128 76
           L 128 148
           M 92 122
           L 128 158
           L 164 122"
        fill="none" stroke="#82d5cc" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- base line the chevron lands on, in the dark on-primary tone for depth -->
  <rect x="92" y="176" width="72" height="14" rx="7" fill="#003733"/>
  <rect x="92" y="174" width="72" height="10" rx="5" fill="#82d5cc"/>
</svg>
