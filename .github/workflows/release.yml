name: Release

on:
  push:
    # Branches ONLY. This workflow ends by running `gh release create`, which
    # creates a tag -- and an unfiltered `push:` trigger fires on tag pushes too,
    # so every release triggered another build which published another release.
    # It ran away from 197 to 213 in ninety minutes before anyone noticed, each
    # one a real release with real artifacts.
    branches:
      - "**"
  workflow_dispatch:

# No concurrency group, deliberately. A group cancels a superseded PENDING run,
# and several pushes in quick succession therefore kept clearing the queue before
# anything reached the publish step. Actions minutes are free on a public
# repository, so runs are simply allowed to proceed in parallel instead.
#
# This is safe because the release tag carries the run number, so two runs can
# never collide on the same tag. It does mean every push publishes its own
# release, which is the intended behaviour here.

# This workflow builds and packages the application and publishes a GitHub Release.
# It intentionally runs NO test job, NO lint job, NO type-check gate, and NO coverage
# check — nothing here can withhold a release on a code-quality verdict. Checking
# happens on the contributor's own machine before pushing. See AGENTS.md.
#
# No `concurrency: cancel-in-progress` group is used here on purpose: publishing a
# release is not idempotent, and cancelling a run mid-flight could strand a tag
# without its artifacts.

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Record workflow start time
        id: start
        shell: pwsh
        run: |
          $startedAt = [DateTimeOffset]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          "started-at=$startedAt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each vendored binary is cached against the exact submodule commit it is
      # built from, so a build only runs when that upstream has actually moved.
      # They are cached SEPARATELY on purpose: yt-dlp advances most days and
      # takes a few minutes, ffmpeg advances rarely and takes about forty. One
      # shared key would rebuild ffmpeg every time yt-dlp moved, throwing away
      # most of the run for nothing.
      #
      # The key IS the submodule SHA, so a cached binary can never be served for
      # a different source revision. There is deliberately no restore-keys
      # fallback: a near-miss restore would hand back a binary built from some
      # other commit while the build step skipped, and the release notes would
      # then state a provenance that is false.
      - name: Resolve vendored source revisions
        id: revs
        shell: pwsh
        run: |
          $ytdlp  = (git -C vendor/yt-dlp rev-parse HEAD).Trim()
          $ffmpeg = (git -C vendor/ffmpeg rev-parse HEAD).Trim()
          "ytdlp=$ytdlp"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ffmpeg=$ffmpeg" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "yt-dlp source: $ytdlp"
          Write-Host "ffmpeg source: $ffmpeg"

      - name: Restore yt-dlp build
        id: cache-ytdlp
        uses: actions/cache@v4
        with:
          path: |
            vendor/bin/yt-dlp.exe
            vendor/bin/yt-dlp.build.json
          key: ytdlp-${{ runner.os }}-${{ steps.revs.outputs.ytdlp }}

      - name: Restore ffmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            vendor/bin/ffmpeg.exe
            vendor/bin/ffprobe.exe
            vendor/bin/ffmpeg.build.json
          key: ffmpeg-${{ runner.os }}-${{ steps.revs.outputs.ffmpeg }}
      - name: Download dependencies
        shell: cmd
        run: .\download-dependencies.bat /s

      - name: Build yt-dlp from pinned source
        if: steps.cache-ytdlp.outputs.cache-hit != 'true'
        shell: cmd
        run: .\build-ytdlp.bat /s

      - name: Build ffmpeg from pinned source
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: cmd
        # windows-latest already ships MSYS2 at C:\msys64; download-dependencies.bat
        # detects and reuses it rather than installing a second copy, so this step
        # only needs to install the missing mingw-w64 packages before building.
        run: .\build-ffmpeg.bat /s

      # A cache hit means a build step was skipped, so nothing has yet proved the
      # restored files are usable. Prove it here rather than finding out at
      # packaging time: every binary the installer bundles must exist and run.
      - name: Verify vendored binaries
        shell: pwsh
        run: |
          Write-Host "yt-dlp cache hit: '${{ steps.cache-ytdlp.outputs.cache-hit }}'"
          Write-Host "ffmpeg cache hit: '${{ steps.cache-ffmpeg.outputs.cache-hit }}'"

          # Capture the output fully BEFORE reading $LASTEXITCODE.
          #
          # `& $exe --version | Select-Object -First 1` looks harmless and is
          # not: Select-Object -First stops the upstream pipeline as soon as it
          # has what it needs, which terminates the native command early and
          # leaves $LASTEXITCODE unset. The first version of this step did that
          # and reported every binary as "(exit )" - an empty exit code - while
          # all three were present and working perfectly.
          $bad = @()
          foreach ($exe in 'yt-dlp', 'ffmpeg', 'ffprobe') {
            $path = "vendor/bin/$exe.exe"
            if (-not (Test-Path $path)) { $bad += "$path (missing)"; continue }

            $flag = if ($exe -eq 'yt-dlp') { '--version' } else { '-version' }
            $output = & $path $flag 2>&1
            $code = $LASTEXITCODE

            if ($code -ne 0) {
              $bad += "$path (exit $code)"
            } else {
              $first = ($output | Select-Object -First 1)
              Write-Host "$exe : $first"
            }
          }

          if ($bad.Count -gt 0) {
            Write-Error ("Vendored binaries missing or not runnable: " + ($bad -join '; ') +
              ". If a cache entry restored files that cannot be used, delete that cache key and rerun.")
            exit 1
          }
          Write-Host "All three bundled binaries are present and runnable."
      # Every release until now shipped version 0.1.0, because nothing ever
      # changed it. That is not cosmetic -- Squirrel.Windows keys its entire
      # install and update model on the version inside the .nupkg. Installing
      # 0.1.0 over an existing 0.1.0 means Squirrel considers that version
      # already present: it does not create a new app-<version> folder, it never
      # fires --squirrel-install, and so IT NEVER CREATES THE SHORTCUT. The old
      # build simply stays on disk while the installer appears to do nothing.
      #
      # That is exactly what was reported: "installer still doesn't create
      # shortcut", on a machine where app-0.1.0 already existed.
      #
      # The run number is monotonic and unique per build, so 0.1.<run> is a valid
      # semver that always moves forward and lets Squirrel tell two builds apart.
      - name: Stamp a unique build version
        shell: pwsh
        run: |
          $manifest = "app/package.json"
          $json = Get-Content $manifest -Raw | ConvertFrom-Json
          $old = $json.version
          $new = "0.1.$($env:GITHUB_RUN_NUMBER)"
          $json.version = $new
          $json | ConvertTo-Json -Depth 100 | Set-Content $manifest -Encoding utf8
          # Read it back rather than trusting the write: a version that silently
          # stayed the same is the whole defect being fixed here.
          $check = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          if ($check -ne $new) {
            Write-Error "Version stamp did not take: wanted $new, file says $check"
            exit 1
          }
          Write-Host "Version $old -> $new"
          "app-version=$new" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: appversion

      - name: Build installer
        shell: cmd
        run: .\build-installer.bat /s

      # This is not lint or a test gate — see the top of this file. It is the one
      # check that answers whether the artifact about to be published actually
      # works: it launches the real packaged app and drives it over CDP. It is
      # deliberately NOT continue-on-error — an installer whose app will not
      # launch is worse than no release, and the always-run artifact collector
      # below still preserves the installer and logs for inspection if this
      # fails. See docs/features/build-and-packaging/smoke-test.md.
      - name: Smoke test the built application
        shell: cmd
        run: node scripts/smoke-test.mjs

      # The smoke test proves the app LOADS. This proves it SURVIVES BEING USED,
      # which is a different question and the one that was not being asked.
      #
      # A regex in the rate-summing helper shipped with every backslash eaten by
      # the template literal it was emitted from, so it parsed as division by an
      # undefined identifier and pressing Download threw on every render. It
      # type-checked, it built, it packaged, and it passed the smoke test --
      # because the mangled line is valid JavaScript. Only pressing the button
      # found it, and nothing in CI pressed anything.
      - name: Drive the built application
        shell: cmd
        run: node scripts/drive-app.mjs

      - name: Compute release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "v" + (Get-Date -AsUTC).ToString("yyyy.MM.dd-HHmmss") + "-$($env:GITHUB_RUN_NUMBER)"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Locate Squirrel artifacts
        id: artifacts
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path app -Recurse -Filter "*Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $releases = Get-ChildItem -Path app -Recurse -Filter "RELEASES" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nupkgs = Get-ChildItem -Path app -Recurse -Filter "*-full.nupkg" -ErrorAction SilentlyContinue
          if (-not $setupExe -or -not $releases -or -not $nupkgs) {
            Write-Error "Squirrel artifacts not found under app/**/dist/squirrel-windows/. Build failed to produce a release."
            exit 1
          }
          $paths = @($setupExe.FullName, $releases.FullName) + ($nupkgs | ForEach-Object { $_.FullName })
          $joined = $paths -join "`n"
          "paths<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $joined | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The smoke test above launches app/dist/win-unpacked -- the build output,
      # not the artifact a user receives. That blind spot is exactly how a
      # release shipped whose installer created no shortcut and appeared to do
      # nothing: the app had no Squirrel lifecycle handling, so Squirrel launched
      # it, the app opened a window and sat there, and the install sequence that
      # waits for that process to exit never reached shortcut creation. Nothing
      # in the build, the package step or the smoke test could see it.
      #
      # This step runs the real Setup.exe on the ephemeral runner and asserts the
      # outcomes a user would notice -- the install directory, Update.exe, the
      # installed executable, and a genuine .lnk on disk (searched recursively:
      # Squirrel nests shortcuts under a publisher subfolder, and a top-level-only
      # scan reports a false negative). It then uninstalls through Squirrel's own
      # path and asserts the shortcut and install directory are actually gone.
      #
      # Gating, like the smoke test and for the same reason: an installer that
      # does not install is worse than no release. The always-run collector below
      # still preserves the installer and every log if this fails.
      - name: Verify the installer
        shell: cmd
        run: node scripts/verify-installer.mjs

      - name: Collect release evidence
        id: evidence
        # Evidence is informational. It must never withhold a release: a run
        # that built and packaged a working installer should publish it even if
        # a line count or a hash could not be gathered. Where a value is missing
        # the notes say "not recorded" rather than leaving a blank cell that
        # reads as a value of zero.
        continue-on-error: true
        shell: pwsh
        run: |
          # Line count, from the same committed counter anyone can run locally.
          node scripts/count-lines.mjs | Out-File -FilePath line-count.md -Encoding utf8

          # Provenance of the bundled binaries. These are facts about what is
          # actually inside the installer, so they are read back off disk rather
          # than repeated from the build log.
          $stamp = Get-Content vendor/bin/yt-dlp.build.json -Raw | ConvertFrom-Json
          "ytdlp-version=$($stamp.ytdlpVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ytdlp-sha=$($stamp.sha256)"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "submodule-sha=$($stamp.submoduleSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $ffstamp = Get-Content vendor/bin/ffmpeg.build.json -Raw | ConvertFrom-Json
          "ffmpeg-version=$($ffstamp.ffmpegVersion)"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ffmpeg-sha=$($ffstamp.ffmpegSha256)"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ffprobe-sha=$($ffstamp.ffprobeSha256)"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ffmpeg-submodule-sha=$($ffstamp.submoduleSha)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $setup = Get-ChildItem -Path app -Recurse -Filter "*Setup*.exe" | Select-Object -First 1
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "setup-sha=$setupHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup-size=$([math]::Round($setup.Length / 1MB, 1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pick dim sum code name
        id: dimsum
        shell: pwsh
        continue-on-error: true
        run: |
          # Decoration with a purpose, and never a gate: if the public catalog
          # cannot be reached or every dish is used, the release still ships.
          $raw = node scripts/pick-dim-sum.mjs . 2>&1 | Select-Object -Last 1
          if ($raw -and $raw.StartsWith("{")) {
            $dish = $raw | ConvertFrom-Json
            "name=$($dish.nameEn) - $($dish.nameZhHant)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "asset=$($dish.assetName)"                   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "id=$($dish.id)"                             | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "No dim sum code name resolved: $raw"
          }

      - name: Record completion time and duration
        id: finish
        shell: pwsh
        run: |
          $startedAt = [DateTimeOffset]::Parse("${{ steps.start.outputs.started-at }}")
          $completedAt = [DateTimeOffset]::UtcNow
          $duration = $completedAt - $startedAt
          $durationStr = "{0:D2}:{1:D2}:{2:D2}" -f [int]$duration.TotalHours, $duration.Minutes, $duration.Seconds
          "completed-at=$($completedAt.ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "duration=$durationStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          # Evidence collection is allowed to fail, so every value it produces
          # may be empty here. Substitute an explicit "not recorded" rather than
          # emitting an empty table cell, which a reader would take as a value.
          function Fallback($v) { if ([string]::IsNullOrWhiteSpace($v)) { 'not recorded' } else { $v } }
          $ytdlpVersion = Fallback '${{ steps.evidence.outputs.ytdlp-version }}'
          $submoduleSha = Fallback '${{ steps.evidence.outputs.submodule-sha }}'
          $ytdlpSha     = Fallback '${{ steps.evidence.outputs.ytdlp-sha }}'
          $setupSha     = Fallback '${{ steps.evidence.outputs.setup-sha }}'
          $setupSize    = Fallback '${{ steps.evidence.outputs.setup-size }}'
          $codeName     = Fallback '${{ steps.dimsum.outputs.name }}'

          $notes = @"
          ## yt-dlp Studio ${{ steps.tag.outputs.tag }}

          **This installer is unsigned, on purpose.** Code signing is permanently out of
          scope for this project. Windows will show an "unknown publisher" SmartScreen
          warning when you run Setup.exe — this is expected and does not indicate the
          installer is corrupted or malicious.

          **This build ran no automated tests.** This project's CI builds and packages
          releases; it does not run a test or lint gate. See AGENTS.md for why.

          ### Workflow timing

          - Workflow started: ${{ steps.start.outputs.started-at }}
          - Workflow completed: ${{ steps.finish.outputs.completed-at }}
          - Workflow duration: ${{ steps.finish.outputs.duration }}

          ### What is inside the installer

          Nothing has to be installed separately. Both yt-dlp and ffmpeg are
          **built from pinned source** during this workflow rather than
          downloaded as prebuilt binaries. ffmpeg is an LGPL build (no
          ``--enable-gpl``, no ``--enable-nonfree``) — see
          [building-ffmpeg-from-source.md](docs/features/build-and-packaging/building-ffmpeg-from-source.md).

          | | |
          | --- | --- |
          | yt-dlp version | ``$ytdlpVersion`` |
          | Built from submodule commit | ``$submoduleSha`` |
          | yt-dlp.exe SHA-256 | ``$ytdlpSha`` |
          | ffmpeg version | ``${{ steps.evidence.outputs.ffmpeg-version }}`` |
          | Built from submodule commit | ``${{ steps.evidence.outputs.ffmpeg-submodule-sha }}`` |
          | ffmpeg.exe SHA-256 | ``${{ steps.evidence.outputs.ffmpeg-sha }}`` |
          | ffprobe.exe SHA-256 | ``${{ steps.evidence.outputs.ffprobe-sha }}`` |
          | Setup.exe SHA-256 | ``$setupSha`` |
          | Setup.exe size | $setupSize MB |

          ### Artifacts

          - Setup.exe (Squirrel.Windows installer, unsigned)
          - RELEASES
          - Full .nupkg package

          ### Code name

          **$codeName** - photo attached where available, from the public
          catalog at Ding-Ding-Projects/dim-sum-photos.

          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          if (Test-Path line-count.md) {
            Get-Content line-count.md -Raw | Out-File -FilePath release-notes.md -Encoding utf8 -Append
          } else {
            "`n### Line count`n`nNot recorded for this release - evidence collection did not complete." |
              Out-File -FilePath release-notes.md -Encoding utf8 -Append
          }

          # Trim each path: GITHUB_OUTPUT is written with CRLF, so splitting on
          # "`n" alone leaves a trailing carriage return on every entry and gh
          # then reports "no matches found" for a file that is sitting right there.
          $files = "${{ steps.artifacts.outputs.paths }}" -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }
          $dish = "${{ steps.dimsum.outputs.asset }}"
          if ($dish -and (Test-Path $dish)) { $files += (Resolve-Path $dish).Path }

          gh release create "${{ steps.tag.outputs.tag }}" `
            --title "yt-dlp Studio ${{ steps.tag.outputs.tag }}" `
            --notes-file release-notes.md `
            --target "${{ github.sha }}" `
            $files

      # ------------------------------------------------------------------
      # Always collect what the run produced, even when an earlier step
      # failed.
      #
      # This exists because of two real failures. A run built the installer,
      # packaged it, computed its tag and located its artifacts, then died
      # reading its own build stamp; another died because the pattern used to
      # find the setup executable could never match its filename. In both
      # cases a perfectly good 181 MB installer was sitting on the runner and
      # was thrown away with it, after roughly fifty minutes of work.
      #
      # Collection and upload are both `always()` so they run after a failure,
      # and both `continue-on-error` so a problem HERE can never mask the
      # original failure or turn a red run green.
      # ------------------------------------------------------------------
      - name: Collect build output
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "run-output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Context first, so a downloaded artifact can be traced back to the
          # exact run and commit that produced it rather than guessed at.
          @"
          run id       : ${{ github.run_id }}
          run number   : ${{ github.run_number }}
          commit       : ${{ github.sha }}
          ref          : ${{ github.ref }}
          job status   : ${{ job.status }}
          runner       : ${{ runner.os }} ${{ runner.arch }}
          collected at : $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))
          "@ | Out-File -FilePath "$out/run-context.txt" -Encoding utf8

          # Only explicitly safe paths. Never node_modules, never the source
          # tree, never anything that could carry a credential.
          $wanted = @(
            'app/dist/squirrel-windows/*Setup*.exe',
            'app/dist/squirrel-windows/RELEASES',
            'app/dist/squirrel-windows/*.nupkg',
            'vendor/bin/*.build.json',
            'vendor/toolchain/*.log',
            'line-count.md',
            'release-notes.md'
          )
          foreach ($pattern in $wanted) {
            Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination $out -Force -ErrorAction SilentlyContinue
              "collected: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
            }
          }

          # A listing even when a file is missing, so the artifact answers
          # "was it built?" and not only "here is what was built".
          Get-ChildItem -Path app/dist -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize | Out-String |
            Out-File -FilePath "$out/dist-listing.txt" -Encoding utf8

      - name: Upload build output
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_number }}
          path: run-output
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
